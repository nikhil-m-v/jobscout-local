[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jobscout-engine"
version = "0.1.0"
description = "Local application engine for JobScout"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
desktop = ["pyinstaller>=6,<7"]

[tool.setuptools.packages.find]
where = ["apps/engine/src"]

[tool.pytest.ini_options]
testpaths = ["apps/engine/tests"]

