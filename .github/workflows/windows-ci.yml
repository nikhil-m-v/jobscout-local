name: Windows CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  CARGO_TERM_COLOR: never

jobs:
  validation:
    name: Synthetic validation (Windows)
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Create isolated Python environment
        run: python -m venv .venv
      - name: Install engine test dependencies
        run: .venv/Scripts/python.exe -m pip install -e ".[dev]"
      - name: Run synthetic checks and production frontend build
        run: npm run validate:ci
      - name: Retain synthetic reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: synthetic-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            work/ci/validation-*/*.log
            work/ci/validation-*/engine.xml
            work/ci/validation-*/summary.json
          retention-days: 7
          if-no-files-found: warn

  packaging:
    name: Windows installer
    needs: validation
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/work/ci-target
      JOBSCOUT_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Select Windows Rust toolchain
        run: rustup default 1.98.1-x86_64-pc-windows-msvc
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Create isolated Python environment
        run: python -m venv .venv
      - name: Install engine packaging dependencies
        run: .venv/Scripts/python.exe -m pip install -e ".[desktop]"
      - name: Build and stage installer-only export
        id: package
        run: npm run package:installer
      - name: Check lockfile stability
        run: git diff --exit-code -- package-lock.json apps/desktop/src-tauri/Cargo.lock
      - name: Retain unsigned installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unsigned-windows-x64-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.installer-path }}
          retention-days: 7
          if-no-files-found: error
      - name: Retain packaging audit
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: package-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.audit-path }}
          retention-days: 7
          if-no-files-found: error
